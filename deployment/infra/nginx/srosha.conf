# srosha. TLS ends here; nothing behind this speaks it.
#
# NOT deployed from this repository. Copy to /etc/nginx/conf.d/srosha.conf on
# the server -- see deployment/infra/README.md.
#
#   panel / admin  ->  127.0.0.1:8000   ->  Traefik `web`  ->  console 8090 / 8092
#   api            ->  127.0.0.1:50051  ->  gateway, gRPC, no Traefik in between
#
# One certificate covers all three (certbot --nginx, cert name srosha.ir).
# nginx 1.24 here, so HTTP/2 is a listen flag and not `http2 on`.

server {
    listen 80;
    listen [::]:80;
    server_name panel.srosha.ir admin.srosha.ir api.srosha.ir;

    # Certbot renews over http-01 and inserts its own, more specific location
    # into this block, so the redirect does not get in the way of a renewal.
    location / {
        return 301 https://$host$request_uri;
    }
}

# The console: two hostnames, one container, two ports. Traefik decides which
# by the Host header, so `proxy_set_header Host` is not optional -- without it
# both would arrive as 127.0.0.1 and neither router rule would match.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name panel.srosha.ir admin.srosha.ir;

    ssl_certificate     /etc/letsencrypt/live/srosha.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/srosha.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# The gateway: grpc_pass, not proxy_pass. gRPC is HTTP/2 the whole way, which
# is the reason api skips Traefik -- its `web` entrypoint is HTTP/1.1, and
# turning h2c on there would mean editing the traefik.yml this host shares
# with every other application on it.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.srosha.ir;

    ssl_certificate     /etc/letsencrypt/live/srosha.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/srosha.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    # The service refuses a notification over 1MB of its own accord; this
    # leaves room for framing and turns anything wilder away at the door.
    client_max_body_size 4m;

    location / {
        grpc_pass grpc://127.0.0.1:50051;

        # Every rpc here is unary and none of them is slow, but the 60s
        # default would also cut a connection a client is holding open
        # between calls.
        grpc_read_timeout 300s;
        grpc_send_timeout 300s;
    }
}
