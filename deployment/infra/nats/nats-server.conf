# NATS server configuration for the srosha notification service.
#
# NOT deployed from this repository. See deployment/infra/README.md.
#
# Mount this at /etc/nats/nats-server.conf. In Dokploy:
#   Compose service -> Advanced -> Mounts -> add a File Mount,
#   path nats-server.conf, and paste this content.
#
# $VAR references are expanded from the container environment, so no secret
# is ever written into this file. A missing variable is not an empty password:
# the server refuses to start and names the variable.
#
# THE THREE PASSWORD VARIABLES HOLD BCRYPT HASHES, NOT PASSWORDS. Generate one
# with:
#
#   docker run --rm natsio/nats-box nats server passwd --pass '<the password>'
#
# Clients keep sending the plaintext; the server never holds it. Nothing about
# the lines below changes -- the hash arrives through the same substitution.
#
# BUT: DOUBLE EVERY `$` BEFORE PASTING IT INTO DOKPLOY.
#
#   generated   $2a$11$ZrJMkGPv9rFsvd9K1C2SSOIo9DMU0tDBlIIzQxzvkYhOan5CI92sq
#   paste this  $$2a$$11$$ZrJMkGPv9rFsvd9K1C2SSOIo9DMU0tDBlIIzQxzvkYhOan5CI92sq
#
# compose reads that file and expands `${...}`, so an unescaped hash is read as
# a variable reference and the value arrives TRUNCATED AT THE THIRD `$` --
# measured, the container received exactly `$2a$11`. `env_file:` does not help;
# it is interpolated too. This is the same family as the `#` that Dokploy
# truncated a password on once before.
#
# Two checks, and do both:
#
#   docker exec <nats> env | grep NATS_        the whole hash, not a stub
#   docker logs <nats> | grep -i plaintext     nothing
#
# That second line is the real detector. A raw password -- or a stub that is no
# longer valid bcrypt -- produces
# `[WRN] Plaintext passwords detected, use nkeys or bcrypt` on every start.

server_name: srosha-nats

# Client port. Reachable only from the srosha-net docker network -- the compose
# file uses `expose`, never `ports`, so nothing is published to the host.
listen: 0.0.0.0:4222

# Monitoring endpoint: JSON only, and it has NO authentication of any kind.
# It must never be published to the host or given a domain.
#
# Nothing is published to the host, so an ssh -L to the host's own localhost
# reaches nothing. Read it from inside instead:
#   docker exec <nats-container> wget -qO- http://localhost:8222/varz
#   docker exec <nats-container> wget -qO- http://localhost:8222/jsz
http: 0.0.0.0:8222

# ---------------------------------------------------------------------------
# JetStream
# ---------------------------------------------------------------------------
# store_dir must sit on the named volume. If that volume is lost you lose not
# just queued messages but the durable consumers themselves -- including every
# message's delivery count, which is where our whole retry policy lives.
#
# The server appends a `jetstream` directory of its own, so the data actually
# lands in /data/jetstream/jetstream. That is still inside the volume.
jetstream {
  store_dir: /data/jetstream

  # This is an emergency brake, not a size. The stream is WorkQueue: a message
  # is deleted the moment it is acknowledged, so in normal running the store is
  # very nearly empty. The number only matters on the day nothing is draining.
  #
  # It must therefore sit well BELOW the free space on the disk, or it brakes
  # nothing. That is the mistake it was in until 2026-09-01: 8GB, chosen on a
  # host that had room for it, still 8GB on a host with 15GB free and thirty
  # other applications on the same volume. A ceiling above the cliff.
  #
  # 2GB, against notifications capped at 1MB each and usually a few KB, is
  # hundreds of thousands of undelivered messages -- a backlog that should have
  # raised an alarm long before it raises a disk-full. And the worst case now
  # leaves 13GB to Postgres and everything else.
  #
  # Raise it only after checking `df -h /` on the host, not from memory.
  max_memory_store: 256MB
  max_file_store: 2GB
}

# ---------------------------------------------------------------------------
# Authentication
# ---------------------------------------------------------------------------
# Least privilege per binary, and every subject below was MEASURED rather than
# reasoned about. That distinction is the whole point of this block.
#
# These used to say `$JS.API.>`, which is the entire JetStream admin surface --
# create, update, delete, purge, and every consumer verb. Since JetStream
# delivers on `_INBOX.>` and both users may subscribe there, the gateway
# credential could delete the dispatcher's consumer, put its own in its place,
# read every notification body, and then delete the stream. Tested, on
# 2026-09-01, before this was written.
#
# The list was found by running the binaries' own calls against a nats with
# `trace: true` and reading which subjects the client library actually used --
# AccountInfo, CreateOrUpdateStream, Publish for the gateway; the same plus
# CreateOrUpdateConsumer, Consume and Ack for the dispatcher. Reading the Go
# source would have missed `$JSC.CI.>`, which the consume machinery subscribes
# to and which appears nowhere in this repository. A missing subject fails as a
# timeout and not as an error, so guessing here is not cheap.
#
# THE STREAM NAME IS BAKED INTO THESE SUBJECTS. It is `NOTIFY`, the default of
# NOTIF_MQ_STREAM. Change that variable and these lines have to change with it,
# or both binaries lose JetStream with no clear error.
#
# Quoting matters: "$JS.API.INFO" inside quotes is a subject, not an
# environment variable reference. Verified.
#
# To re-measure after a library upgrade: set `trace: true` here, grant `>` to
# one user, run the binary, and read the `[PUB` and `[SUB` lines out of the
# nats log.
#
# If you hit permission errors while bringing this up, temporarily replace this
# whole block with a single unrestricted user to confirm the rest works, then
# add the restrictions back one user at a time.
authorization {
  users = [
    {
      # Submits a notification and makes sure the stream exists. That is all
      # it does, and this is all of it: no consumer verb, no delete, no purge,
      # no way to list what else is on the server.
      user: "gateway"
      password: $NATS_GATEWAY_PASSWORD
      permissions: {
        publish: {
          allow: [
            "notify.>",
            "$JS.API.INFO",
            "$JS.API.STREAM.CREATE.NOTIFY",
            "$JS.API.STREAM.UPDATE.NOTIFY"
          ]
        }
        subscribe: {
          # A JetStream publish waits for its acknowledgement here, which is
          # also why this cannot be narrowed further: the inbox name is
          # generated per connection.
          allow: ["_INBOX.>"]
        }
      }
    },
    {
      user: "dispatcher"
      password: $NATS_DISPATCHER_PASSWORD
      permissions: {
        publish: {
          allow: [
            "$JS.API.INFO",
            "$JS.API.STREAM.CREATE.NOTIFY",
            "$JS.API.STREAM.UPDATE.NOTIFY",
            # Its own durable consumer, by name. Not any consumer.
            "$JS.API.CONSUMER.CREATE.NOTIFY.dispatcher.>",
            "$JS.API.CONSUMER.MSG.NEXT.NOTIFY.dispatcher",
            # How a message is acknowledged. Without it every one redelivers.
            "$JS.ACK.NOTIFY.dispatcher.>"
          ]
        }
        subscribe: {
          # $JSC.CI.> is the consume machinery's own status subject. It is not
          # in any documentation this repository cites and appears nowhere in
          # our code -- it turned up in the trace, and leaving it out is one of
          # the ways this fails as a silent timeout.
          #
          # `notify.>` used to be here and is gone: a pull consumer is
          # delivered on its inbox, and the trace never shows a core subscribe
          # to the business subject.
          allow: ["_INBOX.>", "$JSC.CI.>"]
        }
      }
    },
    {
      # For the `nats` CLI from a client on srosha-net. Keep this password out
      # of any application config.
      #
      # This is the one credential bcrypt fully protects. No binary holds it,
      # so once the variable carries a hash there is no plaintext copy of it
      # anywhere on the machine -- unlike the two above, whose passwords the
      # gateway and dispatcher still carry inside NOTIF_*_MQ_URL.
      user: "admin"
      password: $NATS_ADMIN_PASSWORD
    }
  ]
}

# ---------------------------------------------------------------------------
# Limits
# ---------------------------------------------------------------------------
max_payload: 1MB       # a notification body; anything larger is a bug
max_connections: 256
max_control_line: 4KB
write_deadline: "10s"

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
debug: false
trace: false
logtime: true
