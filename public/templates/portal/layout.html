{{define "layout"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>srosha</title>
  <link rel="stylesheet" href="/static/portal.css">
  <link rel="icon" href="/static/crane.svg" type="image/svg+xml">
</head>
<body>
<div class="shell">

  <aside class="niche">
    <svg class="tiles" aria-hidden="true">
      <defs>
        <pattern id="girih" width="72" height="72" patternUnits="userSpaceOnUse">
          <g fill="none" stroke="#27438F" stroke-width="1">
            <polygon points="21.1,0 50.9,0 72,21.1 72,50.9 50.9,72 21.1,72 0,50.9 0,21.1"></polygon>
            <path d="M21.1 0 0 21.1M50.9 0 72 21.1M72 50.9 50.9 72M21.1 72 0 50.9"></path>
          </g>
        </pattern>
      </defs>
      <rect width="100%" height="100%" fill="url(#girih)"></rect>
    </svg>
    <div class="glaze"></div>

    <div class="niche-body">
      <img class="crane" src="/static/crane.svg" alt="" width="58" height="58">
      <div>
        <h1 class="brand">srosha</h1>
        <p class="claim">One message, handed over once, delivered on eight channels.</p>
        <ul class="channels">
          <li>email</li><li>telegram</li>
          <li>bale</li><li>whatsapp</li>
          <li>matrix</li><li>gotify</li><li>fcm</li>
          <li>apns</li>
        </ul>
      </div>
    </div>
  </aside>

  <main class="column">
    <div class="form">
      {{if .SignedIn}}
      <nav class="nav" aria-label="Portal">
        <a href="/sources">Sources</a>
        <a href="/">Account</a>
        <form method="post" action="/signout"><button type="submit">Sign out</button></form>
      </nav>
      {{end}}
      {{template "content" .}}
    </div>
  </main>

</div>
</body>
</html>{{end}}
