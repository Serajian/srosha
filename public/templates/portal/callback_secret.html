{{define "content"}}
<h2 class="head">Your signing secret</h2>
<p class="sub">Copy it now. This is the only time it is shown.</p>

<div class="reveal">
  <code class="k">{{.Secret}}</code>
  <span class="cap">{{.URL}}</span>
</div>

<p class="hint">
  Every callback srosha sends you is signed with this. Check the signature
  before you trust the body — that is what it is for, and the SDK does it in one
  call.
</p>

<p class="fine"><a href="/sources/{{.SourceID}}/callback">I've saved it</a></p>
{{end}}
