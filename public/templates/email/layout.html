{{define "layout"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- This letter is already dark. Without these two, a client in dark mode
       re-tints it on our behalf and decides for itself what the gold becomes. -->
  <meta name="color-scheme" content="dark">
  <meta name="supported-color-schemes" content="dark">
  <title>srosha</title>
</head>
<body style="margin: 0; padding: 0; background-color: #040A1C;">

<!-- The preview line, hidden in the letter and shown in the inbox.
     It exists for the same reason the code is not in the subject: without it a
     client fills the preview from the top of the body, and the digits show up
     on a locked screen. It is written long enough to fill that space itself. -->
<div style="display: none; max-height: 0; overflow: hidden; mso-hide: all;">Your code is inside this message. Type it into the page that asked for it -- it lasts ten minutes and works once.</div>

<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color: #040A1C;">
  <tr>
    <td align="center" style="padding: 24px;">

      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width: 600px; background-color: #081234; border: 1px solid #16295E; border-radius: 6px;">
        <tr>
          <td style="padding: 40px; font-family: 'Vazirmatn', system-ui, -apple-system, 'Segoe UI', sans-serif;">

            <div style="font-size: 14px; font-weight: 400; letter-spacing: 0.3em; text-transform: uppercase; color: #EEF2FB;">srosha</div>

            <div style="height: 30px; font-size: 0; line-height: 0;">&nbsp;</div>

            {{template "content" .}}

          </td>
        </tr>
      </table>

    </td>
  </tr>
</table>

</body>
</html>{{end}}
