syntax = "proto3";

package notification.v1;

import "google/protobuf/timestamp.proto";
import "notification/v1/common.proto";

option go_package = "github.com/Serajian/srosha/gen/notification/v1;notificationv1";

// CredentialService manages the sending identities a source sends as: which
// Telegram bot, which SMTP account.
//
// A source that registers none still sends -- srosha's own credentials are used
// then. This is for a customer who wants their messages to arrive from their own
// bot rather than ours.
//
// As in the other services, no request carries a source id. Which source is
// calling comes from their key.
service CredentialService {
  // Register opens an identity on one channel. The name is how a message asks
  // for it later, in SubmitRequest's Route.sender.
  rpc Register(CredentialServiceRegisterRequest) returns (CredentialServiceRegisterResponse);

  // List answers "what have I registered". Switched-off identities are in it,
  // and that is the point: without them nobody can turn one back on.
  rpc List(CredentialServiceListRequest) returns (CredentialServiceListResponse);

  // Deactivate stops an identity being used without forgetting it, so turning
  // it back on is not a re-registration. Nothing here deletes: after an incident
  // the first question is when an identity was withdrawn, and a deleted row
  // answers nothing.
  //
  // If it held the default, the channel is left with none until SetDefault names
  // one. Guessing which should take over would move it silently.
  rpc Deactivate(CredentialServiceDeactivateRequest) returns (CredentialServiceDeactivateResponse);

  // Activate is the way back. It does not hand the default back.
  rpc Activate(CredentialServiceActivateRequest) returns (CredentialServiceActivateResponse);

  // SetDefault moves which identity a message that names none uses. A channel
  // has at most one, so this takes it from whichever held it.
  rpc SetDefault(CredentialServiceSetDefaultRequest) returns (CredentialServiceSetDefaultResponse);

  // Rotate replaces the secret and keeps the name, which is what a leaked token
  // needs: registering a second identity instead would make every message still
  // naming the old one fail, turning a leak into a code change.
  rpc Rotate(CredentialServiceRotateRequest) returns (CredentialServiceRotateResponse);
}

// The service's own name is in it because RegisterRequest is already taken by
// WebhookService, and one proto package cannot hold two messages with the same
// name.
message CredentialServiceRegisterRequest {
  Channel channel = 1;

  // What this source calls it: "marketing", "alerts". Lowercase letters, digits
  // and hyphens, because it travels in a url and in a config key.
  string name = 2;

  // Everything the provider needs that is not secret, as a json object: an smtp
  // host and port, a chat id. It stays opaque json the whole way down -- giving
  // it a shape here would make supporting a second provider a change to this
  // contract, and every client would have to regenerate for a provider they do
  // not use.
  string config = 3;

  // The part that must not be readable in a database dump: a bot token, an smtp
  // password. Stored encrypted and never returned by any rpc -- not by this one,
  // not by any listing. A customer who loses it registers a new one.
  //
  // May be empty: some providers need only their settings.
  string secret = 4;

  // Whether messages that name no identity on this channel should use this one.
  // A channel has at most one, so registering a second default moves it.
  bool is_default = 5;
}

message CredentialServiceRegisterResponse {
  Credential credential = 1;
}

// Credential is a sending identity as the service describes it back.
//
// It has no secret field and never will. Everything here is safe to log, to
// cache and to show in a console; the secret went one way.
message Credential {
  string id = 1;
  Channel channel = 2;
  string name = 3;

  bool is_default = 4;
  bool is_active = 5;

  google.protobuf.Timestamp created_at = 6;
}

message CredentialServiceListRequest {
  // Empty means every channel.
  Channel channel = 1;
}

message CredentialServiceListResponse {
  repeated Credential credentials = 1;
}

// The id of the identity to act on. It is scoped to the calling source, so an
// id belonging to somebody else is not found rather than acted on.
message CredentialServiceDeactivateRequest {
  string id = 1;
}

message CredentialServiceActivateRequest {
  string id = 1;
}

message CredentialServiceSetDefaultRequest {
  string id = 1;
}

message CredentialServiceRotateRequest {
  string id = 1;

  // The new secret. Never returned by any rpc, here or anywhere else.
  string secret = 2;
}

// Each answers with the identity as it now stands, so a client does not have to
// list again to see what changed.
message CredentialServiceDeactivateResponse {
  Credential credential = 1;
}

message CredentialServiceActivateResponse {
  Credential credential = 1;
}

message CredentialServiceSetDefaultResponse {
  Credential credential = 1;
}

message CredentialServiceRotateResponse {
  Credential credential = 1;
}
